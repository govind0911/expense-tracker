<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Expense Tracker Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#f6fbff;--card:#fff;--muted:#6b7280;--shadow:0 6px 18px rgba(26,38,63,.08);--radius:14px}
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:Poppins,sans-serif;background:var(--bg)}
.container{max-width:1200px;margin:auto}
.header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:none;padding:10px 14px;border-radius:12px;cursor:pointer}
.primary{background:#2563eb;color:#fff}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:20px 0}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-card{background:#fff;padding:20px;border-radius:14px;width:350px}
input,select{width:100%;padding:10px;margin:5px 0 12px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div>
<h1>Expense Tracker</h1>
<p id="userText"></p>
</div>
<div>
<button class="btn" onclick="location.href='homepage.html'">🏠 Home</button>
<button class="btn primary" onclick="openModal()">+ Add Expense</button>
</div>
</div>

<div class="cards">
<div class="card"><h3>Balance</h3><h2 id="balance"></h2></div>
<div class="card"><h3>Total Spent</h3><h2 id="spent"></h2></div>
<div class="card"><h3>Monthly Limit</h3><h2 id="limit"></h2></div>
<div class="card"><h3>Transactions</h3><h2 id="txcount"></h2></div>
</div>

<div class="grid">
<div class="card">
<h3>Expense Trend</h3>
<canvas id="chart"></canvas>
</div>

<div class="card">
<h3>Recent Transactions</h3>
<table>
<thead><tr><th>Item</th><th>Amount</th></tr></thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div>
</div>

<div class="modal" id="modal">
<div class="modal-card">
<h3>Add Expense</h3>
<input id="item" placeholder="Item">
<input id="amount" type="number" placeholder="Amount">
<select id="category">
<option>Food</option>
<option>Stationery</option>
<option>Other</option>
</select>
<button class="btn primary" onclick="saveExpense()">Save</button>
<button class="btn" onclick="closeModal()">Cancel</button>
</div>
</div>

<script>
const KEY='studentExpenses_v1';

function load(){
let d=JSON.parse(localStorage.getItem(KEY)||'{}');
if(!d.settings)d.settings={balance:10000,limit:1000};
if(!d.transactions)d.transactions=[];
return d;
}

function save(d){
localStorage.setItem(KEY,JSON.stringify(d));
}

let data=load();

function updateUI(){
balance.textContent='₹'+data.settings.balance;
limit.textContent='₹'+data.settings.limit;

const spentTotal=data.transactions.reduce((s,t)=>s+Number(t.amount||0),0);
spent.textContent='₹'+spentTotal;
txcount.textContent=data.transactions.length;

tableBody.innerHTML='';
data.transactions.slice().reverse().slice(0,10).forEach(t=>{
tableBody.innerHTML+=`<tr><td>${t.name}</td><td>₹${t.amount}</td></tr>`;
});

renderChart();
}

function renderChart(){
const ctx=document.getElementById('chart');
if(window.myChart)window.myChart.destroy();

window.myChart=new Chart(ctx,{
type:'bar',
data:{
labels:data.transactions.map(t=>t.name),
datasets:[{
label:'Expenses',
data:data.transactions.map(t=>t.amount)
}]
}
});
}

function openModal(){modal.classList.add('show');}
function closeModal(){modal.classList.remove('show');}

function saveExpense(){
const name=item.value.trim();
const amountVal=Number(amount.value);

if(!name||amountVal<=0)return;

data.transactions.push({
name:name,
amount:amountVal,
category:category.value,
date:new Date().toISOString()
});

save(data);
updateUI();
closeModal();

item.value='';
amount.value='';
}

userText.textContent='Logged in as '+(localStorage.getItem('expense_user')||'User');

updateUI();
</script>
</body>
</html>
