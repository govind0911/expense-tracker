<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homepage - Expense Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6fbff;--card:#fff;--muted:#6b7280;--accent:#2563eb;--shadow:0 6px 18px rgba(26,38,63,.12);--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,sans-serif;background:var(--bg);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:#fff;max-width:1000px;width:100%;padding:28px;border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{background:var(--accent);color:#fff;border:none;padding:12px;border-radius:12px;cursor:pointer}
.btn:hover{transform:translateY(-2px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.card-small{padding:18px;border-radius:14px;background:rgba(255,255,255,.7);box-shadow:var(--shadow);transition:.25s}
.card-small:hover{transform:translateY(-6px)}
#welcome{display:none}
#datetime{text-align:center;color:var(--muted);margin:10px 0 20px}
</style>
</head>
<body>
<div class="card">
<div id="login">
<h2>Login</h2><br>
<input id="username" placeholder="Username" style="width:100%;padding:12px"><br><br>
<input id="password" type="password" placeholder="Password" style="width:100%;padding:12px"><br><br>
<button class="btn" style="width:100%" onclick="login()">Login</button>
</div>

<div id="welcome">
<h1 id="welcomeText"></h1>
<div id="datetime"></div>

<div class="grid">
<div class="card-small"><h3>Balance</h3><p id="liveBalance">₹0</p></div>
<div class="card-small"><h3>Income</h3><p id="income">₹15000</p></div>
<div class="card-small"><h3>Expenses</h3><p id="expenses">₹0</p></div>
<div class="card-small"><h3>Transactions</h3><p id="txcount">0</p></div>
</div>

<br>
<button class="btn" onclick="location.href='index.html'">📊 Open Dashboard</button>
<button class="btn" onclick="logout()">Logout</button>
</div>
</div>

<script>
const LS_KEY='studentExpenses_v1';

function loadData(){
try{return JSON.parse(localStorage.getItem(LS_KEY))||{}}
catch{return {}}
}

function updateDateTime(){
document.getElementById('datetime').textContent=new Date().toLocaleString();
}
setInterval(updateDateTime,1000);

function updateStats(){
const data=loadData();
const balance=data.settings?.balance||0;
const tx=data.transactions||[];
const spent=tx.reduce((a,b)=>a+Number(b.amount||0),0);

liveBalance.textContent='₹ '+balance;
expenses.textContent='₹ '+spent;
txcount.textContent=tx.length;
}

function login(){
const user=username.value.trim();
const pass=password.value.trim();

if(!user||!pass){
alert('Enter username and password');
return;
}

localStorage.setItem('expense_user',user);
localStorage.setItem('expense_logged_in','true');

showDashboard();
}

function showDashboard(){
const user=localStorage.getItem('expense_user')||'User';
login.style.display='none';
welcome.style.display='block';
welcomeText.textContent=`Hi ${user}, how are you :)`;
updateDateTime();
updateStats();
}

function logout(){
localStorage.removeItem('expense_logged_in');
localStorage.removeItem('expense_user');
location.reload();
}

if(localStorage.getItem('expense_logged_in')==='true'){
showDashboard();
}
</script>
</body>
</html>
